<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Coffee Origins</title>
</head>
<body>
    <div class="card">
        <img src="Ethiopia.JPG" alt="Ethiopian Coffee">
        <div class="card-content">
            <h2 id="country">Ethiopia</h2>
            <p class="meta">Birthplace of Coffee · Washed Process</p>
            <p class="flavor">Jasmine · Citrus · Black Tea</p>
            <p class="description">The original home of coffee. Bright, floral, and delicately tea-like, with the iconic clarity that started the global specialty coffee movement.</p>
        </div>
    </div>
        

</body>
</html>
